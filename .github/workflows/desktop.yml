name: Build desktop apps

on:
  push:
    branches: [main, feat/desktop-web-preview]
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to build
        type: choice
        required: true
        default: all
        options: [all, windows, macos, linux]

permissions:
  contents: read

jobs:
  build:
    name: Desktop · ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: >-
          ${{ fromJSON(
            inputs.platform == 'windows' && '["windows-2025"]' ||
            inputs.platform == 'macos' && '["macos-15","macos-15-intel"]' ||
            inputs.platform == 'linux' && '["ubuntu-24.04"]' ||
            '["windows-2025","macos-15","macos-15-intel","ubuntu-24.04"]'
          ) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm package:desktop

      - name: Check packaged runtime and create archive
        shell: bash
        run: |
          set -euo pipefail
          out=dist/artifacts
          mkdir -p "$out"
          arch=$(node -p 'process.arch')
          case "$RUNNER_OS" in
            Windows)
              dir="View-win32-$arch"
              ELECTRON_RUN_AS_NODE=1 "dist/desktop/$dir/View.exe" .github/scripts/check-packaged-runtime.mjs
              # Use Windows bsdtar, which writes ZIP by extension with -a.
              bsdtar="$(cygpath -u "$(node -p 'process.env.SystemRoot')")/System32/tar.exe"
              "$bsdtar" -a -cf "$out/View-windows-$arch.zip" -C dist/desktop "$dir"
              ;;
            macOS)
              bundle="dist/desktop/View-darwin-$arch/View.app"
              ELECTRON_RUN_AS_NODE=1 "$bundle/Contents/MacOS/View" .github/scripts/check-packaged-runtime.mjs
              ditto -c -k --sequesterRsrc --keepParent "$bundle" "$out/View-macos-$arch.zip"
              ;;
            Linux)
              dir="View-linux-$arch"
              ELECTRON_RUN_AS_NODE=1 "dist/desktop/$dir/View" .github/scripts/check-packaged-runtime.mjs
              tar -czf "$out/View-linux-$arch.tar.gz" -C dist/desktop "$dir"
              ;;
          esac

      - name: Upload desktop app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/artifacts/*
          archive: false
          if-no-files-found: error
